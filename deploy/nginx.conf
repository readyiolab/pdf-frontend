server {
    listen 80;
    server_name pdf.zuvigo.com;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — deep links must not 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed Vite assets — long cache, immutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must revalidate on deploy
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Content Security Policy for the static shell
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com https://checkout.razorpay.com; connect-src 'self' https://apipdf.zuvigo.com wss://apipdf.zuvigo.com; img-src 'self' data: blob: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-src https://checkout.razorpay.com;" always;
}
